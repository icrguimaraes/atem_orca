name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  backend:
    name: Backend (ruff + pytest)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: atem_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check . && ruff format --check .
      - run: pytest -q -p no:logging
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/atem_test
          SECRET_KEY: ci-secret-key-0123456789-abcdefghijklmnop
      - run: psql -h localhost -U postgres -c "create database atem_ci"
        env:
          PGPASSWORD: postgres
      - name: Migrações sobem e descem sem divergir do modelo
        run: |
          alembic upgrade head && alembic downgrade base && alembic upgrade head
          python - <<'PY'
          from sqlalchemy import create_engine
          from alembic.autogenerate import compare_metadata
          from alembic.runtime.migration import MigrationContext
          import os
          from app.models import Base
          with create_engine(os.environ["DATABASE_URL"]).connect() as c:
              diff = compare_metadata(MigrationContext.configure(c), Base.metadata)
          assert not diff, diff
          PY
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/atem_ci
          PGPASSWORD: postgres

  frontend:
    name: Frontend (tsc + vite build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build
