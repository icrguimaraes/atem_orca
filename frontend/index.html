<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/brand/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Sofia+Sans:wght@300..800&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet" />
    <title>Orçamento · Controladoria e Tributos</title>
    <script>
      try {
        var t = localStorage.getItem("atem.theme");
        if (t === "light" || t === "dark") { document.documentElement.setAttribute("data-theme", t); document.documentElement.style.colorScheme = t; }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
